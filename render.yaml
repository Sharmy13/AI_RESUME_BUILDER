services:
  - type: web
    name: resume-builder-backend
    env: node
    root: backend
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false

  - type: static
    name: resume-builder-frontend
    root: .
    plan: starter
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
